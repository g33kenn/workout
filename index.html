<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Stopwatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Font for Numbers to prevent jumping */
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            touch-action: manipulation; /* Improves touch response */
            -webkit-tap-highlight-color: transparent;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Prevent text selection */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Custom button press effect */
        .btn-press:active {
            transform: scale(0.96);
            opacity: 0.85;
            background-color: rgba(59, 130, 246, 0.25) !important;
        }

        #lapBtn {
            transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.1s ease;
        }

        body {
            transition: background-color 0.2s, color 0.2s;
        }

        /* Light mode */
        body.light { background-color: #f9fafb; color: #111827; }
        body.light #mainTimerDisplay { color: #111827 !important; }
        body.light #mainMilliseconds { color: #6b7280 !important; }
        body.light #totalTimeDisplay { color: #374151 !important; }
        body.light #setsDisplay     { color: #1d4ed8 !important; }
        body.light .lbl             { color: #6b7280 !important; }
        body.light .sep             { border-color: #d1d5db !important; }
        body.light #lapBtn {
            background-color: #e5e7eb !important;
            color: #1d4ed8 !important;
            border-color: #d1d5db !important;
        }
        body.light #lapBtn.btn-press:active {
            background-color: rgba(29, 78, 216, 0.15) !important;
        }

        /* Icon visibility */
        .icon-moon { display: block; }
        .icon-sun  { display: none;  }
        body.light .icon-moon { display: none;  }
        body.light .icon-sun  { display: block; }
    </style>
</head>
<body class="h-screen w-full flex flex-col justify-between overflow-hidden no-select p-4">

    <!-- Top Bar -->
    <div class="w-full flex justify-between h-12 items-start">
        <button id="themeBtn" onclick="toggleTheme()"
            class="p-2 rounded-lg btn-press text-gray-500 hover:text-gray-300 transition-colors">
            <!-- Moon: visible in dark mode -->
            <svg class="icon-moon w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <!-- Sun: visible in light mode -->
            <svg class="icon-sun w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
        <button onclick="resetTimer()"
            class="text-xs text-red-400 border border-red-900 bg-red-900/20 px-3 py-2 rounded-lg btn-press hover:bg-red-900/40 transition-colors uppercase tracking-widest font-bold">
            Reset
        </button>
    </div>

    <!-- Main Display Area -->
    <div class="flex-grow flex flex-col justify-center items-center space-y-8">
        
        <!-- Sets Counter -->
        <div class="text-center">
            <div class="lbl text-gray-500 text-sm uppercase tracking-widest mb-1">Sets Completed</div>
            <div id="setsDisplay" class="text-8xl font-bold text-blue-500 mono-font">0</div>
        </div>

        <!-- Main Stopwatch (Recovery/Interval Timer) -->
        <div class="text-center w-full">
            <div class="lbl text-gray-500 text-sm uppercase tracking-widest mb-2">Recovery Time</div>
            <div id="mainTimerDisplay" class="text-7xl font-bold text-white mono-font tracking-tighter">00:00</div>
            <div id="mainMilliseconds" class="text-2xl text-gray-600 mono-font font-medium mt-1">.00</div>
        </div>

    </div>

    <!-- Bottom Controls Area -->
    <div class="w-full pb-8">
        <!-- Main Buttons -->
        <div class="flex justify-center gap-4 mb-8">
            <!-- Lap Button -->
			<button id="lapBtn" onclick="lapTimer()"
			  class="h-24 rounded-2xl bg-gray-800 text-blue-400 font-bold text-2xl uppercase tracking-wider btn-press shadow-lg border border-gray-700 w-64">
			  END OF SET
			</button>

            <!-- Start/Pause Button -->
            <!--
            <button id="startBtn" onclick="toggleTimer()" 
                class="h-24 rounded-2xl bg-green-900/80 text-green-400 font-bold text-2xl uppercase tracking-wider btn-press shadow-lg border border-green-800">
                Start
            </button>
            -->
        </div>

        <!-- Total Time -->
        <div class="text-center border-t sep border-gray-800 pt-4">
            <span class="lbl text-gray-500 text-xs uppercase tracking-wide">Total Session Time</span>
            <div id="totalTimeDisplay" class="text-xl text-gray-400 mono-font mt-1">00:00:00</div>
        </div>
    </div>

    <script>
        // State variables
        let startTime;
        let updatedTime;
        let difference;
        let tInterval;
        let running = false;
        
        // Wake Lock
        let wakeLock = null;
        let screenLockActive = false;
        let isRequestingWakeLock = false;

        let totalStartTime;
        let totalDifference;
        
        // Counters
        let mainTimeElapsed = 0; // The big timer
        let totalTimeElapsed = 0; // The bottom total timer
        let setsCount = 0;

        // DOM Elements
        const mainTimerDisplay = document.getElementById('mainTimerDisplay');
        const mainMilliseconds = document.getElementById('mainMilliseconds');
        const totalTimeDisplay = document.getElementById('totalTimeDisplay');
        const setsDisplay = document.getElementById('setsDisplay');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                // Prevent concurrent requests or if we already have a lock
                if (isRequestingWakeLock || (wakeLock !== null && !wakeLock.released)) {
                    return;
                }

                isRequestingWakeLock = true;
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        console.log('Screen Wake Lock released:', wakeLock.released);
                    });
                    console.log('Screen Wake Lock acquired:', wakeLock.released);
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                } finally {
                    isRequestingWakeLock = false;
                }
            }
        }

        function enableAlwaysOnDisplay() {
            screenLockActive = true;
            requestWakeLock();
        }

        // Try to enable always-on display on any user interaction
        document.addEventListener('click', enableAlwaysOnDisplay);
        document.addEventListener('touchstart', enableAlwaysOnDisplay);

        // Visibility Change Handler
        document.addEventListener('visibilitychange', async () => {
            if (screenLockActive && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        function toggleTimer() {
            if (!running) {
                startTimer();
            } else {
                pauseTimer();
            }
        }

        function startTimer() {
            if (!running) {
                startTime = new Date().getTime() - mainTimeElapsed;
                totalStartTime = new Date().getTime() - totalTimeElapsed;
                
                tInterval = setInterval(getShowTime, 10);
                running = true;

                // Request Screen Wake Lock
                screenLockActive = true;
                requestWakeLock();
                
                lapBtn.className = "h-24 w-64 rounded-2xl bg-gray-800 text-blue-400 font-bold text-2xl uppercase tracking-wider btn-press shadow-lg border border-gray-700";
            }
        }

        function pauseTimer() {
            if (running) {
                clearInterval(tInterval);
                running = false;
                
            }
        }

        function resetTimer() {
            clearInterval(tInterval);
            running = false;
            
            // Note: We deliberately do NOT release the wake lock here anymore.
            // The user wants the screen to stay on even if they reset the timer.

            mainTimeElapsed = 0;
            totalTimeElapsed = 0;
            setsCount = 0;
            
            // Reset Displays
            mainTimerDisplay.innerHTML = "00:00";
            mainMilliseconds.innerHTML = ".00";
            totalTimeDisplay.innerHTML = "00:00:00";
            setsDisplay.innerHTML = "0";
            
            lapBtn.className = "h-24 w-64 rounded-2xl bg-gray-800 text-blue-400 font-bold text-2xl uppercase tracking-wider btn-press shadow-lg border border-gray-700";
        }

        function lapTimer() {
            // Increment sets
            setsCount++;
            setsDisplay.innerHTML = setsCount;
            
            // Reset the main timer (Interval/Recovery timer)
            mainTimeElapsed = 0;
            startTime = new Date().getTime(); // Reset start time to now
            
            // Visual feedback flash
            const mainContainer = document.querySelector('.flex-grow');
            
            // Ensure timer is running if it wasn't
            if (!running) {
                startTimer();
            }
        }

        function getShowTime() {
            let now = new Date().getTime();
            
            // Calculate Main Timer (Interval)
            mainTimeElapsed = now - startTime;
            
            // Calculate Total Timer (Session)
            totalTimeElapsed = now - totalStartTime;

            // Format Main Timer
            let mainMinutes = Math.floor((mainTimeElapsed % (1000 * 60 * 60)) / (1000 * 60));
            let mainSeconds = Math.floor((mainTimeElapsed % (1000 * 60)) / 1000);
            let mainMillis = Math.floor((mainTimeElapsed % 1000) / 10);

            mainMinutes = (mainMinutes < 10) ? "0" + mainMinutes : mainMinutes;
            mainSeconds = (mainSeconds < 10) ? "0" + mainSeconds : mainSeconds;
            mainMillis = (mainMillis < 10) ? "0" + mainMillis : mainMillis;

            mainTimerDisplay.innerHTML = mainMinutes + ':' + mainSeconds;
            mainMilliseconds.innerHTML = '.' + mainMillis;

            // Format Total Timer
            let totalHours = Math.floor((totalTimeElapsed % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let totalMinutes = Math.floor((totalTimeElapsed % (1000 * 60 * 60)) / (1000 * 60));
            let totalSeconds = Math.floor((totalTimeElapsed % (1000 * 60)) / 1000);

            totalHours = (totalHours < 10) ? "0" + totalHours : totalHours;
            totalMinutes = (totalMinutes < 10) ? "0" + totalMinutes : totalMinutes;
            totalSeconds = (totalSeconds < 10) ? "0" + totalSeconds : totalSeconds;

            // Only show hours if > 0
            if (totalHours > 0) {
                 totalTimeDisplay.innerHTML = totalHours + ':' + totalMinutes + ':' + totalSeconds;
            } else {
                 totalTimeDisplay.innerHTML = totalMinutes + ':' + totalSeconds;
            }
        }
    </script>
</body>
</html>
